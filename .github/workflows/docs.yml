name: docs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[docs]"
      - name: Build (strict)
        run: mkdocs build --strict
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with: { node-version: "24" }
      - name: Every mermaid block parses (mkdocs --strict does not check them)
        run: |
          mkdir -p /tmp/mermaid && cp scripts/check_mermaid.mjs /tmp/mermaid/
          echo '{"private": true}' > /tmp/mermaid/package.json
          npm install --prefix /tmp/mermaid --no-audit --no-fund --silent mermaid@11.17.2 jsdom@26.1.0
          node /tmp/mermaid/check_mermaid.mjs README.md docs
      - name: /demo/ must be the path explorer, not a docs page
        run: grep -q LINCHPIN_STATIC site/demo/index.html || { echo "::error::/demo/ is not the explorer"; exit 1; }
      - name: Publish the preprint next to the docs
        run: if [ -f paper/linchpin.pdf ]; then mkdir -p site/paper && cp paper/linchpin.pdf site/paper/; fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with: { path: site }
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
